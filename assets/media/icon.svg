<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Swift-blue background circle -->
  <circle cx="256" cy="256" r="248" fill="#1e6091"/>
  <!-- Inner accent ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#0f4c75" stroke-width="8"/>

  <!-- Stylised swift in flight (Apus / Tachymarptis): anchor / boomerang silhouette -->
  <g transform="translate(256 270)" fill="#ffffff">
    <!-- Wings (sweeping crescent from tip to tip, scythe-shaped) -->
    <path d="
      M -210 30
      C -150 -10, -90 -30, -40 -28
      C -10 -28, 10 -28, 40 -28
      C 90 -30, 150 -10, 210 30
      C 170 8, 110 -4, 60 -8
      C 20 -10, -20 -10, -60 -8
      C -110 -4, -170 8, -210 30 Z"/>
    <!-- Body (slim torpedo at centre, slightly forward) -->
    <ellipse cx="0" cy="-22" rx="14" ry="38"/>
    <!-- Head (small bump on top of body) -->
    <circle cx="0" cy="-58" r="14"/>
    <!-- Forked tail -->
    <path d="M -10 12 L 0 28 L 10 12 L 0 4 Z"/>
  </g>
</svg>
