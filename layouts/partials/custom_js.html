{{ if eq hugo.Environment "production" }}
  <script async defer src="https://buttons.github.io/buttons.js"></script>
{{end}}

<!-- Add flag emojis to the language switcher dropdown -->
<script>
  (function () {
    var flags = {
      'English': '🇬🇧',
      'Italiano': '🇮🇹',
      'Italian': '🇮🇹'
    };
    function decorate() {
      var items = document.querySelectorAll('.i18n-dropdown .dropdown-menu span, .i18n-dropdown .nav-link span.d-none.d-lg-inline');
      items.forEach(function (s) {
        var t = s.textContent.trim();
        if (flags[t] && s.textContent.indexOf(flags[t]) === -1) {
          s.textContent = flags[t] + ' ' + t;
        }
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', decorate);
    } else {
      decorate();
    }
  })();
</script>
